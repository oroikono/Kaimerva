<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">01 / TWO SOURCES</title><desc id="desc">Two equal sources A and B are placed at minus and plus 2.25 on the horizontal axis. The study uses one shared wavelength, 2.4 arbitrary units, and one shared phase. This is an illustrative scalar construction, not an acoustic simulation.</desc>
<defs><clipPath id="plot"><rect x="60" y="110" width="1080" height="540" rx="20"/></clipPath><radialGradient id="ink"><stop stop-color="#142d3b"/><stop offset="1" stop-color="#081923"/></radialGradient><radialGradient id="source-glow"><stop stop-color="#e7e1c5" stop-opacity=".3"/><stop offset="1" stop-color="#e7e1c5" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="720" fill="url(#ink)"/>
<text x="60" y="57" fill="#f1ead6" font-family="system-ui,sans-serif" font-size="36" font-weight="500" letter-spacing="1">01 / TWO SOURCES</text>
<text x="1140" y="56" fill="#67c7c6" font-family="system-ui,sans-serif" font-size="20" text-anchor="end" letter-spacing="3">ILLUSTRATIVE STUDY</text>
<path d="M60 82H1140" stroke="#f1ead6" stroke-opacity=".18"/>
<g clip-path="url(#plot)" fill="none" stroke="#a4b5bd" stroke-opacity=".08" stroke-width="1"><path d="M60.00 650.00V110.00"/><path d="M137.14 650.00V110.00"/><path d="M214.29 650.00V110.00"/><path d="M291.43 650.00V110.00"/><path d="M368.57 650.00V110.00"/><path d="M445.71 650.00V110.00"/><path d="M522.86 650.00V110.00"/><path d="M600.00 650.00V110.00"/><path d="M677.14 650.00V110.00"/><path d="M754.29 650.00V110.00"/><path d="M831.43 650.00V110.00"/><path d="M908.57 650.00V110.00"/><path d="M985.71 650.00V110.00"/><path d="M1062.86 650.00V110.00"/><path d="M1140.00 650.00V110.00"/><path d="M60.00 611.43H1140.00"/><path d="M60.00 534.29H1140.00"/><path d="M60.00 457.14H1140.00"/><path d="M60.00 380.00H1140.00"/><path d="M60.00 302.86H1140.00"/><path d="M60.00 225.71H1140.00"/><path d="M60.00 148.57H1140.00"/></g><path d="M426.43 380.0H773.57" stroke="#f1ead6" stroke-opacity=".22" stroke-dasharray="6 9"/><text x="600" y="235" fill="#f1ead6" font-family="system-ui,sans-serif" font-size="32" text-anchor="middle">ONE WAVELENGTH · ONE PHASE</text><text x="600" y="558" fill="#8ab1bd" font-family="system-ui,sans-serif" font-size="24" text-anchor="middle">Read the contribution of each source before their sum.</text><g font-family="system-ui,sans-serif" font-size="24" font-weight="500"><circle cx="426.43" cy="380.00" r="54" fill="url(#source-glow)"/><circle cx="426.43" cy="380.00" r="13" fill="#0a1c28" stroke="#67c7c6" stroke-width="3"/><circle cx="426.43" cy="380.00" r="4" fill="#f1ead6"/><text x="426.43" y="350.00" fill="#f1ead6" text-anchor="middle">A</text><circle cx="773.57" cy="380.00" r="54" fill="url(#source-glow)"/><circle cx="773.57" cy="380.00" r="13" fill="#0a1c28" stroke="#c3a16c" stroke-width="3"/><circle cx="773.57" cy="380.00" r="4" fill="#f1ead6"/><text x="773.57" y="350.00" fill="#f1ead6" text-anchor="middle">B</text></g><text x="60" y="694" fill="#f1ead6" font-family="system-ui,sans-serif" font-size="24">A (−2.25, 0)     B (+2.25, 0)</text><text x="1140" y="694" fill="#67c7c6" font-family="system-ui,sans-serif" font-size="20" text-anchor="end">Coordinates and amplitudes are arbitrary units</text></svg>
